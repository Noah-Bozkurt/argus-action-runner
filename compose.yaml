services:
  runner:
    image: ghcr.io/noah-bozkurt/argus-action-runner:main
    restart: unless-stopped
    init: true
    environment:
      RUNNER_URL: ${RUNNER_URL:-https://github.com/Noah-Bozkurt}
      RUNNER_SCOPE: ${RUNNER_SCOPE:-org}
      RUNNER_NAME_PREFIX: ${RUNNER_NAME_PREFIX:-argus-runner}
      RUNNER_LABELS: ${RUNNER_LABELS:-argus,docker}
      RUNNER_GROUP: ${RUNNER_GROUP:-}
      RUNNER_CFG_PAT_FILE: /run/secrets/runner_pat
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID to the group ID of /var/run/docker.sock}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - runner_pat
    stop_grace_period: 30s

secrets:
  runner_pat:
    file: ${RUNNER_PAT_FILE:-./secrets/runner_pat}
